<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>//reacr cdn
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>//react dom
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script> //babel cdn
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const App = () => {
            return (
                <div>
                    <h1>Hello, React with CDN!</h1>
                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
    
</body>
</html>
